<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manager Login</title>

    <link rel="stylesheet" href="manager.css">

</head>


<body>

    <!-- HEADER -->

    <header class="manager-login-header">

        <h1>
            Employee Leave Management
        </h1>

        <span>
            Manager Portal
        </span>

    </header>


    <!-- LOGIN -->

    <main class="login-page">

        <div class="login-box">

            <div class="login-icon">
                🔐
            </div>

            <h2>
                Manager Login
            </h2>

            <p class="login-description">
                Sign in to manage employee leave requests.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter manager username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter manager password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login to Manager Portal
                </button>


                <p
                    id="loginError"
                    class="login-error"
                ></p>

            </form>


            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Employee Portal
            </a>

        </div>

    </main>


    <footer class="simple-footer">

        Employee Leave Management System © 2026

    </footer>


    <script src="manager.js"></script>

</body>

</html>
